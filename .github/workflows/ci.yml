name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock
      - name: Run tests
        run: pytest tests/unit/ -v

  build:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "VoiceInjector" `
            --hidden-import "PySide6.QtCore" `
            --hidden-import "PySide6.QtGui" `
            --hidden-import "PySide6.QtWidgets" `
            --hidden-import "sounddevice" `
            --hidden-import "numpy" `
            --hidden-import "pyttsx3" `
            --hidden-import "aiohttp" `
            --hidden-import "pydantic" `
            --hidden-import "src.core.tts_engine" `
            --hidden-import "src.core.audio_router" `
            --hidden-import "src.core.cache_manager" `
            --hidden-import "src.core.queue_manager" `
            --hidden-import "src.config.config_manager" `
            --hidden-import "src.utils.logger" `
            --hidden-import "src.utils.device_utils" `
            --add-data "src;src" `
            --paths . src/main.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInjector-Windows
          path: dist/VoiceInjector.exe
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/VoiceInjector.exe
          generate_release_notes: true
