name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock
      - name: Run tests
        run: pytest tests/unit/ -v

  build:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "VoiceInjector" `
            --hidden-import "PySide6.QtCore" `
            --hidden-import "PySide6.QtGui" `
            --hidden-import "PySide6.QtWidgets" `
            --hidden-import "sounddevice" `
            --hidden-import "numpy" `
            --hidden-import "pyttsx3" `
            --hidden-import "aiohttp" `
            --hidden-import "pydantic" `
            --hidden-import "src.core.tts_engine" `
            --hidden-import "src.core.audio_router" `
            --hidden-import "src.core.cache_manager" `
            --hidden-import "src.core.queue_manager" `
            --hidden-import "src.config.config_manager" `
            --hidden-import "src.utils.logger" `
            --hidden-import "src.utils.device_utils" `
            --add-data "src;src" `
            --paths . src/main.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInjector-Windows-${{ steps.version.outputs.tag }}
          path: dist/VoiceInjector.exe
      - name: Delete old latest release
        if: steps.version.outputs.tag == 'latest'
        uses: chip/action-delete-release@v1.3.1
        with:
          release: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Delete old latest tag
        if: steps.version.outputs.tag == 'latest'
        run: git push origin :refs/tags/latest
        continue-on-error: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "VoiceInjector ${{ steps.version.outputs.tag }}"
          body: |
            ## VoiceInjector ${{ steps.version.outputs.tag }}

            **Download `VoiceInjector.exe`** và chạy trực tiếp trên Windows 10/11.

            ### Yêu cầu
            - Cài [VB-Cable](https://vb-audio.com/Cable/) để có virtual mic

            ### Sử dụng
            1. Chọn Virtual Mic trong dropdown
            2. Paste text tiếng Anh
            3. Bấm Speak All
            4. Web app speaking chọn microphone tương ứng
          files: dist/VoiceInjector.exe
          prerelease: ${{ steps.version.outputs.tag == 'latest' }}
          make_latest: ${{ steps.version.outputs.tag != 'latest' }}
          generate_release_notes: true
