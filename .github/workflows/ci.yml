name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  pull-requests: write
  actions: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
      - name: Lint with flake8
        run: flake8 src/ tests/ --count --statistics --max-line-length=100 --extend-ignore=E203,W503
      - name: Check formatting with black
        run: black --check src/ tests/

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-pyaudio ffmpeg
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio ffmpeg
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock pytest-qt pytest-cov
      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  build-windows:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "VoiceInjector" `
            --hidden-import "PySide6.QtCore" `
            --hidden-import "PySide6.QtGui" `
            --hidden-import "PySide6.QtWidgets" `
            --hidden-import "sounddevice" `
            --hidden-import "numpy" `
            --hidden-import "pyttsx3" `
            --hidden-import "aiohttp" `
            --hidden-import "pydantic" `
            --hidden-import "src.core.tts_engine" `
            --hidden-import "src.core.audio_router" `
            --hidden-import "src.core.cache_manager" `
            --hidden-import "src.core.queue_manager" `
            --hidden-import "src.config.config_manager" `
            --hidden-import "src.utils.logger" `
            --hidden-import "src.utils.device_utils" `
            --add-data "src;src" `
            --paths . src/main.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInjector-Windows
          path: dist/VoiceInjector.exe
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/VoiceInjector.exe
          generate_release_notes: true

  build-macos:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: brew install portaudio ffmpeg
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build DMG
        run: |
          pyinstaller --onefile --windowed --name "VoiceInjector" `
            --hidden-import "PySide6.QtCore" `
            --hidden-import "PySide6.QtGui" `
            --hidden-import "PySide6.QtWidgets" `
            --hidden-import "sounddevice" `
            --hidden-import "numpy" `
            --hidden-import "pyttsx3" `
            --hidden-import "aiohttp" `
            --hidden-import "pydantic" `
            --hidden-import "src.core.tts_engine" `
            --hidden-import "src.core.audio_router" `
            --hidden-import "src.core.cache_manager" `
            --hidden-import "src.core.queue_manager" `
            --hidden-import "src.config.config_manager" `
            --hidden-import "src.utils.logger" `
            --hidden-import "src.utils.device_utils" `
            --add-data "src:src" `
            --paths . src/main.py
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInjector-macOS
          path: dist/VoiceInjector
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/VoiceInjector*
          generate_release_notes: true
